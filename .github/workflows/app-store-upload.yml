name: App Store Upload

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare App Store icons
        run: |
          PLIST="Carat24/Resources/Info.plist"
          ICON_DIR="Carat24/Resources/Assets.xcassets/AppIcon.appiconset"
          SOURCE_ICON="$ICON_DIR/Carat24-AppIcon-1024.png"

          if /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST"
          fi

          make_icon() {
            cp "$SOURCE_ICON" "$ICON_DIR/$1"
            sips -z "$2" "$2" "$ICON_DIR/$1" >/dev/null
          }

          make_icon "Icon-iPhone-20@2x.png" 40
          make_icon "Icon-iPhone-20@3x.png" 60
          make_icon "Icon-iPhone-29@2x.png" 58
          make_icon "Icon-iPhone-29@3x.png" 87
          make_icon "Icon-iPhone-40@2x.png" 80
          make_icon "Icon-iPhone-40@3x.png" 120
          make_icon "Icon-iPhone-60@2x.png" 120
          make_icon "Icon-iPhone-60@3x.png" 180
          make_icon "Icon-iPad-20.png" 20
          make_icon "Icon-iPad-20@2x.png" 40
          make_icon "Icon-iPad-29.png" 29
          make_icon "Icon-iPad-29@2x.png" 58
          make_icon "Icon-iPad-40.png" 40
          make_icon "Icon-iPad-40@2x.png" 80
          make_icon "Icon-iPad-76.png" 76
          make_icon "Icon-iPad-76@2x.png" 152
          make_icon "Icon-iPad-83.5@2x.png" 167

          cat > "$ICON_DIR/Contents.json" <<'JSON'
          {
            "images": [
              { "filename": "Icon-iPhone-20@2x.png", "idiom": "iphone", "scale": "2x", "size": "20x20" },
              { "filename": "Icon-iPhone-20@3x.png", "idiom": "iphone", "scale": "3x", "size": "20x20" },
              { "filename": "Icon-iPhone-29@2x.png", "idiom": "iphone", "scale": "2x", "size": "29x29" },
              { "filename": "Icon-iPhone-29@3x.png", "idiom": "iphone", "scale": "3x", "size": "29x29" },
              { "filename": "Icon-iPhone-40@2x.png", "idiom": "iphone", "scale": "2x", "size": "40x40" },
              { "filename": "Icon-iPhone-40@3x.png", "idiom": "iphone", "scale": "3x", "size": "40x40" },
              { "filename": "Icon-iPhone-60@2x.png", "idiom": "iphone", "scale": "2x", "size": "60x60" },
              { "filename": "Icon-iPhone-60@3x.png", "idiom": "iphone", "scale": "3x", "size": "60x60" },
              { "filename": "Icon-iPad-20.png", "idiom": "ipad", "scale": "1x", "size": "20x20" },
              { "filename": "Icon-iPad-20@2x.png", "idiom": "ipad", "scale": "2x", "size": "20x20" },
              { "filename": "Icon-iPad-29.png", "idiom": "ipad", "scale": "1x", "size": "29x29" },
              { "filename": "Icon-iPad-29@2x.png", "idiom": "ipad", "scale": "2x", "size": "29x29" },
              { "filename": "Icon-iPad-40.png", "idiom": "ipad", "scale": "1x", "size": "40x40" },
              { "filename": "Icon-iPad-40@2x.png", "idiom": "ipad", "scale": "2x", "size": "40x40" },
              { "filename": "Icon-iPad-76.png", "idiom": "ipad", "scale": "1x", "size": "76x76" },
              { "filename": "Icon-iPad-76@2x.png", "idiom": "ipad", "scale": "2x", "size": "76x76" },
              { "filename": "Icon-iPad-83.5@2x.png", "idiom": "ipad", "scale": "2x", "size": "83.5x83.5" },
              { "filename": "Carat24-AppIcon-1024.png", "idiom": "ios-marketing", "scale": "1x", "size": "1024x1024" }
            ],
            "info": { "author": "xcode", "version": 1 }
          }
          JSON

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install signing certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/Carat24_App_Store_GitHub.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="temporary-keychain-password"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/Carat24_App_Store_GitHub.mobileprovision"

      - name: Archive
        run: |
          xcodebuild archive \
            -project Carat24.xcodeproj \
            -scheme Carat24 \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Carat24.xcarchive" \
            DEVELOPMENT_TEAM=CG98755F9L \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Carat24 App Store GitHub"

      - name: Create export settings
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>CG98755F9L</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ceremybilisim.carat24</key>
              <string>Carat24 App Store GitHub</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Carat24.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: 96YZ8J3WBV
          ASC_ISSUER_ID: 1b6ed897-12c2-411c-a85a-181f823db867
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$ASC_PRIVATE_KEY" | base64 --decode -o "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Carat24.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
